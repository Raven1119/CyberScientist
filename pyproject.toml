[project]
name = "cyberscientist"
version = "0.1.0"
description = "单用户科学竞赛工作台：大脑 + Prime 执行器 + Bohrium 科学计算"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
cyberscientist = "cyberscientist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberscientist"]

[tool.hatch.build.targets.wheel.force-include]
"src/cyberscientist/vendor/trace_score_cli_v6/index.ts" = "cyberscientist/vendor/trace_score_cli_v6/index.ts"
"src/cyberscientist/vendor/trace_score_cli_v6/runner.mjs" = "cyberscientist/vendor/trace_score_cli_v6/runner.mjs"
"src/cyberscientist/vendor/trace_score_cli_v6/LICENSE" = "cyberscientist/vendor/trace_score_cli_v6/LICENSE"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
